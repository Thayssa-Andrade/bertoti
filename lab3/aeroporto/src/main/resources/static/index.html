<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aeroporto | Controle de voos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/aeroporto.css">
    <script src="/aeroporto.js" type="module"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/" aria-label="Aeroporto, início">
            <span class="brand-mark" aria-hidden="true">✈</span>
            Aeroporto
        </a>
        <div class="clock">
            <span>Hora local</span>
            <time id="clock">—</time>
        </div>
    </header>

    <main>
        <section class="hero" aria-labelledby="page-title">
            <div class="hero-content">
                <h1 id="page-title">Controle de voos<span>.</span></h1>
                <p>Cadastre rotas e acompanhe os horários de partida.</p>
            </div>
        </section>

        <div class="workspace">
            <section class="registration" aria-labelledby="form-title">
                <div class="registration-heading">
                    <span aria-hidden="true">+</span>
                    <h2 id="form-title">Novo voo</h2>
                </div>
                <form id="flight-form">
                    <label for="origin">Origem</label>
                    <select id="origin" name="origem" required>
                        <option value="">Selecione a origem</option>
                    </select>
                    <label for="destination">Destino</label>
                    <select id="destination" name="destino" required>
                        <option value="">Selecione o destino</option>
                    </select>
                    <figure class="route-preview" tabindex="-1" aria-labelledby="route-caption">
                        <canvas id="route-globe" width="640" height="520" aria-hidden="true"></canvas>
                        <figcaption id="route-caption" role="status">Selecione a origem e o destino para visualizar a rota.</figcaption>
                    </figure>
                    <label for="departure">Data e hora da partida</label>
                    <input id="departure" type="datetime-local" name="dataVoo" required>
                    <div class="form-actions">
                        <button id="save" class="primary" type="submit">Cadastrar voo</button>
                        <button id="cancel" class="secondary" type="button" hidden>Cancelar</button>
                    </div>
                </form>
                <p id="form-message" class="feedback" role="status"></p>
            </section>

            <section class="flights" aria-labelledby="flights-title">
                <div class="section-heading">
                    <div>
                        <h2 id="flights-title">Painel de voos</h2>
                        <span id="count" role="status"></span>
                    </div>
                    <button id="refresh" class="secondary" type="button">↻ <span>Atualizar</span></button>
                </div>
                <div class="toolbar">
                    <div class="field">
                        <label for="search">Buscar rota</label>
                        <input id="search" type="search" placeholder="Origem ou destino">
                    </div>
                    <div class="field">
                        <label for="sort">Ordenar por</label>
                        <select id="sort">
                            <option value="data-asc">Partida mais próxima</option>
                            <option value="data-desc">Partida mais distante</option>
                            <option value="id-desc">Cadastro mais recente</option>
                            <option value="id-asc">Cadastro mais antigo</option>
                        </select>
                    </div>
                </div>
                <p id="board-message" class="feedback" role="status"></p>
                <div id="board" class="board"></div>
            </section>
        </div>
    </main>

    <template id="flight-card">
        <article class="flight-card">
            <div class="card-heading">
                <span class="flight-id"></span>
                <span class="status"></span>
            </div>
            <div class="route">
                <div><span>Origem</span><strong class="origin"></strong></div>
                <span class="route-track" aria-hidden="true"><b>✈</b></span>
                <div><span>Destino</span><strong class="destination"></strong></div>
            </div>
            <div class="card-footer">
                <div class="departure"><span>Partida</span><time></time></div>
                <div class="card-actions">
                        <button type="button" class="view-route">Ver rota</button>
                    <button type="button" class="edit">Editar</button>
                    <button type="button" class="remove">Remover</button>
                </div>
            </div>
        </article>
    </template>
</body>
</html>
