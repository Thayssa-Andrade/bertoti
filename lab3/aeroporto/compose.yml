services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_RANDOM_PASSWORD: "yes"
      APP_USER: aeroporto
      APP_USER_PASSWORD: ${AEROPORTO_DB_PASSWORD:-AeroportoDev23}
    ports:
      - "127.0.0.1::1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  oracle-data:
