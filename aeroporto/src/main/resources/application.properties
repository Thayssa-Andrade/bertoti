spring.application.name=aeroporto
# ==========================================
# 1. CONFIGURAÇÕES DE CONEXÃO COM O ORACLE
# ==========================================
# A URL de conexão. Se você estiver usando a versão XE local, geralmente é assim:
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
# (Nota: se você usar o Oracle 19c/21c, a URL pode ser jdbc:oracle:thin:@localhost:1521/XEPDB1)

# Seu usuário e senha do banco de dados (ex: SYSTEM)
spring.datasource.username=system
spring.datasource.password=1234

# Opcional, mas recomendado para garantir que o Spring ache o driver correto
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ==========================================
# 2. CONFIGURAÇÕES DO JPA / HIBERNATE
# ==========================================
# Mostra no console (terminal) os comandos SQL que o Spring está criando (ótimo para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# O Dialeto do banco (ajuda o Hibernate a traduzir o Java para o SQL específico do Oracle)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# IMPORTANTE: Essa propriedade diz o que o Spring deve fazer com as tabelas.
# "update": Cria a tabela VOO se ela não existir, ou atualiza a estrutura se você mudar a classe Voo.
# (Em produção, normalmente usamos "validate" ou "none")
spring.jpa.hibernate.ddl-auto=create
